[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agentx"
version = "0.1.0"
description = "A tutorial implementation of the AgentX recommendation optimization workflow"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mini-agentx = "mini_agentx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
